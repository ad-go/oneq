<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>oneq Relay admin</title>
<style>
  :root { --bg:#f6f8f7; --fg:#1b2420; --card:#fff; --muted:#5c6b64; --line:#d5ddd9; --accent:#1b6b5a; --err:#b3261e; --ok:#1b6b5a; --warn:#b26a00; --chip:#e9f0ed; }
  @media (prefers-color-scheme: dark) { :root { --bg:#111614; --fg:#e4ebe7; --card:#1a211e; --muted:#98a8a0; --line:#2c3732; --accent:#4cb89f; --err:#ff8a80; --ok:#4cb89f; --warn:#ffb74d; --chip:#24302b; } }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif; }
  header { display:flex; align-items:center; gap:14px; padding:10px 16px; background:var(--card); border-bottom:1px solid var(--line); position:sticky; top:0; flex-wrap:wrap; }
  header h1 { font-size:18px; margin:0; }
  nav { display:flex; gap:4px; flex:1; flex-wrap:wrap; }
  nav button { border:0; background:none; padding:6px 12px; border-radius:6px; cursor:pointer; color:var(--fg); font:inherit; }
  nav button.on { background:var(--chip); font-weight:600; }
  main { max-width:1000px; margin:0 auto; padding:16px; }
  section { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:16px; margin-bottom:14px; overflow-x:auto; }
  h2 { font-size:16px; margin:0 0 10px; } h3 { font-size:14px; margin:14px 0 6px; color:var(--muted); font-weight:600; }
  table { width:100%; border-collapse:collapse; font-size:14px; } td,th { text-align:left; padding:6px 8px; border-bottom:1px solid var(--line); vertical-align:middle; } th { color:var(--muted); font-weight:500; white-space:nowrap; }
  td.act { text-align:right; white-space:nowrap; }
  button, .btn { padding:6px 12px; border-radius:6px; border:1px solid var(--line); background:var(--card); color:var(--fg); font:inherit; cursor:pointer; }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; } button.danger { color:var(--err); }
  button.small { padding:2px 8px; font-size:13px; }
  button:disabled { opacity:.5; cursor:default; }
  input, select { padding:7px 9px; border:1px solid var(--line); border-radius:6px; background:var(--bg); color:var(--fg); font:inherit; width:100%; }
  label { display:block; font-size:13px; color:var(--muted); margin:10px 0 3px; }
  .chip { display:inline-block; padding:1px 8px; border-radius:10px; background:var(--chip); font-size:12px; }
  .chip.ok { color:var(--ok); } .chip.bad { color:var(--err); } .chip.warn { color:var(--warn); }
  .muted { color:var(--muted); font-size:13px; } .kv td:first-child { color:var(--muted); width:42%; }
  .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-top:10px; }
  #toast { position:fixed; right:16px; bottom:16px; max-width:min(520px,90vw); padding:10px 14px; border-radius:8px; background:var(--card); border:1px solid var(--line); box-shadow:0 4px 18px rgba(0,0,0,.2); display:none; }
  #toast.err { border-color:var(--err); color:var(--err); } #toast.ok { border-color:var(--ok); }
  dialog { border:1px solid var(--line); border-radius:10px; background:var(--card); color:var(--fg); max-width:440px; width:92vw; padding:18px; }
  dialog::backdrop { background:rgba(0,0,0,.45); }
  .login { max-width:360px; margin:12vh auto; }
  .check { display:flex; gap:8px; align-items:center; margin-top:10px; } .check input { width:auto; }
  .mono { font-family:ui-monospace,Menlo,Consolas,monospace; font-size:12px; }
</style>
</head>
<body>
<div id="app"></div>
<div id="toast"></div>
<dialog id="dlg"><form method="dialog" id="dform"><h2 id="dtitle"></h2><div id="dbody"></div>
  <div class="row" style="justify-content:flex-end"><button type="button" id="dcancel">Cancel</button><button type="submit" class="primary" id="dok">OK</button></div></form></dialog>
<script>
'use strict';
const $ = s => document.querySelector(s);
const el = (tag, attrs, ...kids) => {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (k === 'class') e.className = v; else if (k.startsWith('on')) e.addEventListener(k.slice(2), v); else if (v !== false && v != null) e.setAttribute(k, v === true ? '' : v);
  }
  for (const c of kids.flat()) if (c != null && c !== false) e.append(c.nodeType ? c : document.createTextNode(String(c)));
  return e;
};
let token = sessionStorage.getItem('oneq-admin-token') || '';
let view = { page: 'overview' }, data = {};

function toast(msg, err) { const t = $('#toast'); t.textContent = msg; t.className = err ? 'err' : 'ok'; t.style.display = 'block'; clearTimeout(toast.h); toast.h = setTimeout(() => t.style.display = 'none', err ? 8000 : 3500); }

async function api(method, path, body) {
  const r = await fetch('/admin/api' + path, { method, headers: Object.assign({ 'Content-Type': 'application/json' }, token ? { Authorization: 'Bearer ' + token } : {}), body: body === undefined ? undefined : JSON.stringify(body) });
  const text = await r.text();
  if (r.status === 401 && path !== '/login') { logout(); throw new Error('Session expired: sign in again.'); }
  if (!r.ok) throw new Error(text || ('HTTP ' + r.status));
  return text ? JSON.parse(text) : {};
}
async function act(fn, ok) { try { const r = await fn(); if (ok) toast(ok); await refresh(); return r; } catch (e) { toast(e.message, true); } }

// ---- dialog: ask(title, [{name,label,type,value,options,hint}], okLabel) -> values or null
function ask(title, fields, okLabel) {
  return new Promise(res => {
    $('#dtitle').textContent = title; const body = $('#dbody'); body.replaceChildren();
    for (const f of fields) {
      if (f.type === 'info') { body.append(el('p', { class: 'muted' }, f.label)); continue; }
      const id = 'f_' + f.name; let input;
      if (f.type === 'select') input = el('select', { id }, f.options.map(o => el('option', { value: o, selected: o === f.value }, o)));
      else if (f.type === 'checkbox') input = el('input', { id, type: 'checkbox', checked: !!f.value });
      else input = el('input', { id, type: f.type || 'text', value: f.value ?? '', autocomplete: 'off', placeholder: f.hint || '' });
      body.append(f.type === 'checkbox' ? el('div', { class: 'check' }, input, el('label', { for: id, style: 'margin:0' }, f.label)) : el('div', {}, el('label', { for: id }, f.label), input));
    }
    $('#dok').textContent = okLabel || 'OK'; const dlg = $('#dlg');
    const done = v => { dlg.close(); $('#dform').onsubmit = null; $('#dcancel').onclick = null; res(v); };
    $('#dform').onsubmit = e => { e.preventDefault(); const v = {}; for (const f of fields) if (f.name) { const i = $('#f_' + f.name); v[f.name] = f.type === 'checkbox' ? i.checked : i.value; } done(v); };
    $('#dcancel').onclick = () => done(null); dlg.oncancel = () => done(null);
    dlg.showModal(); const first = body.querySelector('input,select'); if (first) first.focus();
  });
}

function logout() { token = ''; sessionStorage.removeItem('oneq-admin-token'); render(); }

// ---- views
function fmtDur(s) { if (s == null) return 'never'; s = Math.round(s); if (s < 90) return s + ' s ago'; if (s < 5400) return Math.round(s / 60) + ' min ago'; return Math.round(s / 3600) + ' h ago'; }
function fmtUp(s) { const d = Math.floor(s / 86400), h = Math.floor(s % 86400 / 3600), m = Math.floor(s % 3600 / 60); return (d ? d + 'd ' : '') + h + 'h ' + m + 'm'; }
function kv(rows) { return el('table', { class: 'kv' }, rows.map(([k, v]) => el('tr', {}, el('td', {}, k), el('td', {}, v)))); }
function th(...c) { return el('thead', {}, el('tr', {}, c.map(x => el('th', {}, x)))); }

function viewOverview() {
  const o = data.overview, r = o.relay, f = o.federation, t = o.totals;
  return [
    el('section', {}, el('h2', {}, 'Relay settings'), kv([
      ['Relay id', r.id], ['Version', r.version], ['Uptime', fmtUp(r.uptime_s)],
      ['Listening on', r.listen || '?'], ['Transport', r.tls ? 'TLS 1.3, X25519MLKEM768 only' : 'plain HTTP (behind a post-quantum reverse proxy)'],
      ['Trust X-Forwarded-For', r.trust_proxy ? 'yes' : 'no'], ['Database', r.db || '?'], ['Federation CA', r.cafile || '(system roots)'],
      ['Configuration file', r.config_file || '(command line only)'],
      ['Nodes attached to this relay now', r.attached_nodes]]),
      el('p', { class: 'muted' }, 'These values come from /etc/oneq/relay.conf and need a restart of the service to change. Federation peers, communities and users below are changed live.')),
    el('section', {}, el('h2', {}, 'Totals (replicated state)'), kv([['Communities', t.communities], ['Users', t.users], ['Registered nodes', t.nodes], ['Nodes online', t.online],
      ['Federation', f.peers.length ? f.peers.length + ' peer(s), secret fingerprint ' + f.secret_fingerprint : 'standalone']])),
    viewNat(o.nat),
    el('section', {}, el('h2', {}, 'Limits built into this version'), kv(Object.entries(r.limits).map(([k, v]) => [k.replaceAll('_', ' '), v])))
  ];
}

function viewNat(n) {
  const s = n.service, mix = Object.entries(n.online_nodes_by_nat_type);
  const types = ['open', 'cone', 'port-restricted', 'symmetric'];
  return el('section', {}, el('h2', {}, 'NAT traversal'),
    s ? kv([['STUN service (UDP)', s.host + ' ports ' + s.port + ' (main), ' + s.alt_port + ' (mapping test), ' + s.change_port + ' (filtering test)'],
            ['Requests answered', s.stats.responses + ' of ' + s.stats.requests + (s.stats.rate_limited ? ' (' + s.stats.rate_limited + ' rate limited)' : '')],
            ['Reachability tests', s.stats.probes_answered + ' answered of ' + s.stats.probes],
            ['Online nodes by NAT type', mix.length ? mix.map(([k, v]) => v + ' ' + k).join(', ') : 'none']])
      : el('p', {}, el('span', { class: 'chip bad' }, 'STUN service off'), ' Nodes cannot measure their NAT or learn their public address; behind a NAT they can only use the relay. Remove --no-stun / stun = no, and open UDP ',
          'ports ', el('b', {}, 'listen port, +1 and +2'), ' in the firewall.'),
    el('h3', {}, 'Which pairs of nodes can connect directly (hole punching)'),
    el('table', {}, th('', ...types), el('tbody', {}, types.map(a => el('tr', {}, el('td', {}, el('b', {}, a)),
      types.map(b => el('td', {}, el('span', { class: 'chip ' + (n.can_punch[a][b] ? 'ok' : 'bad') }, n.can_punch[a][b] ? 'direct' : 'relay'))))))),
    el('p', { class: 'muted' }, 'Everything else always works through the relay. A node reaches the STUN service on the same host as its relay URL, UDP ports ',
      s ? s.port + ', ' + s.alt_port + ' and ' + s.change_port : 'listen port, +1 and +2', '. Behind a NAT only a symmetric one on one side together with a port-restricted or symmetric one on the other side cannot be punched.'));
}

function viewFederation() {
  const f = data.overview.federation;
  return [el('section', {}, el('h2', {}, 'Federation'),
    el('p', { class: 'muted' }, 'This relay is ', el('b', {}, f.origin), '. Accounts, communities, nodes and presence are replicated between the peers; every relay must use the same federation secret (fingerprint ',
      el('span', { class: 'mono' }, f.secret_fingerprint), ') and trust the others\' TLS certificates.'),
    el('table', {}, th('Peer', 'Source', 'Last sync', 'Relay link', ''), el('tbody', {}, f.peers.map(p => el('tr', {},
      el('td', { class: 'mono' }, p.url), el('td', {}, el('span', { class: 'chip' }, p.source)),
      el('td', {}, el('span', { class: 'chip ' + (p.synced_ago_s == null ? 'bad' : p.synced_ago_s > 60 ? 'warn' : 'ok') }, fmtDur(p.synced_ago_s))),
      el('td', {}, f.links.length ? f.links.join(', ') : el('span', { class: 'muted' }, 'none')),
      el('td', { class: 'act' }, p.source === 'admin page' ? el('button', { class: 'small danger', onclick: () => removePeer(p.url) }, 'Remove') : el('span', { class: 'muted' }, 'in relay.conf')))))),
    f.peers.length ? null : el('p', { class: 'muted' }, 'No peers: this relay runs standalone.'),
    el('div', { class: 'row' }, el('button', { class: 'primary', onclick: addPeer }, 'Add peer…'), el('button', { onclick: () => act(() => api('POST', '/federation/sync', {}), 'Sync requested') }, 'Sync now')),
    el('p', { class: 'muted' }, 'Peers added here are stored on this relay only; add the same URL on the other relay for a two-way link. Peers from relay.conf can only be changed in the file.'))];
}
async function addPeer() { const v = await ask('Add federation peer', [{ name: 'url', label: 'Peer URL', hint: 'https://relay2.example.org:8443' }], 'Add'); if (v) act(() => api('POST', '/federation/peers', { url: v.url.trim() }), 'Peer added'); }
async function removePeer(url) { const v = await ask('Remove peer', [{ type: 'info', label: 'Stop synchronising with ' + url + '? Data already replicated stays.' }], 'Remove'); if (v) act(() => api('DELETE', '/federation/peers?url=' + encodeURIComponent(url)), 'Peer removed'); }

function viewCommunities() {
  const cs = data.overview.communities;
  return [el('section', {}, el('h2', {}, 'Communities'),
    el('table', {}, th('Name', 'Subnet', 'MTU', 'Users', 'Nodes (online)', 'Max nodes', ''), el('tbody', {}, cs.map(c => el('tr', {},
      el('td', {}, el('b', {}, c.name)), el('td', { class: 'mono' }, c.subnet), el('td', {}, c.mtu), el('td', {}, c.users), el('td', {}, c.nodes + ' (' + c.online + ')'), el('td', {}, c.max_nodes),
      el('td', { class: 'act' }, el('button', { class: 'small', onclick: () => { view = { page: 'community', name: c.name }; refresh(); } }, 'Open')))))),
    cs.length ? null : el('p', { class: 'muted' }, 'No communities yet.'),
    el('div', { class: 'row' }, el('button', { class: 'primary', onclick: addCommunity }, 'New community…')))];
}
async function addCommunity() {
  const v = await ask('New community', [{ name: 'name', label: 'Name', hint: 'home' }, { name: 'subnet', label: 'Subnet (IPv4, /16 to /29)', value: '10.78.0.0/24' },
    { name: 'mtu', label: 'MTU (1000-1500)', value: '1380' }, { name: 'max_nodes', label: 'Maximum nodes', value: '200' }], 'Create');
  if (v) act(() => api('POST', '/communities', { name: v.name.trim(), subnet: v.subnet.trim(), mtu: +v.mtu, max_nodes: +v.max_nodes }), 'Community created');
}

function viewCommunity() {
  const c = data.comm, name = c.name, enc = encodeURIComponent;
  return [
    el('p', {}, el('button', { class: 'small', onclick: () => { view = { page: 'communities' }; refresh(); } }, '← Communities')),
    el('section', {}, el('h2', {}, 'Community ' + name), kv([['Subnet', c.subnet], ['MTU', c.mtu + '  (nodes pick it up when they reconnect)'], ['Maximum nodes', c.max_nodes]]),
      el('div', { class: 'row' }, el('button', { onclick: () => editCommunity(c) }, 'Edit…'), el('button', { class: 'danger', onclick: () => delCommunity(c) }, 'Delete community…'))),
    el('section', {}, el('h2', {}, 'Users (' + c.users.length + ')'),
      el('table', {}, th('User', 'Role', 'Status', 'Nodes / quota', ''), el('tbody', {}, c.users.map(u => el('tr', {},
        el('td', {}, el('b', {}, u.user)), el('td', {}, el('span', { class: 'chip' }, u.role)),
        el('td', {}, el('span', { class: 'chip ' + (u.disabled ? 'bad' : 'ok') }, u.disabled ? 'disabled' : 'active')), el('td', {}, u.nodes + ' / ' + u.max_nodes),
        el('td', { class: 'act' },
          el('button', { class: 'small', onclick: () => editUser(name, u) }, 'Edit'), ' ',
          el('button', { class: 'small', onclick: () => passwd(name, u.user) }, 'Password'), ' ',
          el('button', { class: 'small', onclick: () => act(() => api('PUT', `/c/${enc(name)}/users/${enc(u.user)}`, { disabled: !u.disabled }), u.disabled ? 'User enabled' : 'User disabled (sessions revoked)') }, u.disabled ? 'Enable' : 'Disable'), ' ',
          el('button', { class: 'small danger', onclick: () => delUser(name, u.user) }, 'Delete')))))),
      c.users.length ? null : el('p', { class: 'muted' }, 'No users: nobody can join this community yet.'),
      el('div', { class: 'row' }, el('button', { class: 'primary', onclick: () => addUser(name) }, 'Add user…'))),
    el('section', {}, el('h2', {}, 'Nodes (' + c.nodes.length + ')'),
      el('table', {}, th('Name', 'Address', 'MAC', 'Owner', 'State', 'NAT', 'Attached to', 'Relay node', ''), el('tbody', {}, c.nodes.map(n => el('tr', {},
        el('td', {}, n.name || el('span', { class: 'muted mono' }, n.id.slice(0, 8))), el('td', { class: 'mono' }, n.ip), el('td', { class: 'mono' }, n.mac), el('td', {}, n.owner),
        el('td', {}, el('span', { class: 'chip ' + (n.online ? 'ok' : '') }, n.online ? 'online' : 'offline')),
        el('td', { title: n.nat && n.nat.mapped ? 'public UDP address ' + n.nat.mapped : '' }, n.nat ? [el('span', { class: 'chip ' + (n.nat.type === 'symmetric' || n.nat.type === 'blocked' ? 'warn' : '') }, n.nat.type),
          n.nat.inbound === true ? el('span', { class: 'chip ok', title: 'the relay reached the node from a port it never contacted' }, 'inbound ✓') : null] : el('span', { class: 'muted' }, '-')),
        el('td', {}, n.relay || '-'),
        el('td', {}, n.relay_role ? [el('span', { class: 'chip ok', title: 'forwards encrypted datagrams for the other members' }, 'relay ' + Math.round(n.relay_role.max_kbps / 1000) + ' Mbit/s'), ' ',
            el('button', { class: 'small', onclick: () => revokeRelay(name, n) }, 'Withdraw')]
          : n.offer ? el('button', { class: 'small', title: 'this node offered to forward datagrams for the other members', onclick: () => grantRelay(name, n) }, 'Delegate…')
          : el('span', { class: 'muted' }, '-')),
        el('td', { class: 'act' }, el('button', { class: 'small danger', onclick: () => delNode(name, n) }, 'Remove')))))),
      c.nodes.length ? null : el('p', { class: 'muted' }, 'No nodes registered.')),
    el('section', {}, el('h2', {}, 'Routes (' + (c.routes || []).length + ')'),
      el('p', { class: 'muted' }, 'A network reachable through a member node (the gateway forwards IP packets to it, normally with NAT). Members that accept routes send the traffic for that network to the gateway. Add the same network through several nodes for redundancy: members use the lowest priority number that is alive and move to the next one when it stops answering.'),
      (c.routes || []).length ? el('table', {}, th('Network', 'Gateway', 'Priority', 'Set by', ''), el('tbody', {}, c.routes.map(r => {
        const g = c.nodes.find(n => n.id === r.via);
        return el('tr', {}, el('td', { class: 'mono' }, r.cidr), el('td', {}, g ? (g.name || g.id.slice(0, 8)) + ' (' + g.ip + ')' : r.via.slice(0, 8)), el('td', {}, String(r.prio) + (c.routes.filter(x => x.cidr === r.cidr)[0] === r ? '  (preferred)' : '')), el('td', {}, r.by),
          el('td', { class: 'act' }, el('button', { class: 'small danger', onclick: () => delRoute(name, r) }, 'Remove')));
      }))) : el('p', { class: 'muted' }, 'No routes.'),
      el('div', { class: 'row' }, el('button', { class: 'primary', onclick: () => addRoute(c) }, 'Add route…')))];
}
async function addRoute(c) {
  const opts = c.nodes.map(n => (n.name || n.id.slice(0, 8)) + ' (' + n.ip + ')');
  const v = await ask('Add route', [{ type: 'info', label: 'The gateway must forward IP packets to the network (ip_forward and NAT on the gateway). Only members started with accept_routes use the route.' },
    { name: 'net', label: 'Network (e.g. 192.168.16.0/24)' }, { name: 'gw', label: 'Gateway node', type: 'select', options: opts, value: opts[0] }, { name: 'prio', label: 'Priority (0-1000, lower is preferred)', value: '100' }], 'Add');
  if (v) act(() => api('PUT', `/c/${encodeURIComponent(c.name)}/routes/${encodeURIComponent(v.net.trim().replace('/', '_'))}`, { via: c.nodes[opts.indexOf(v.gw)].id, prio: +v.prio }), 'Route added');
}
async function delRoute(comm, r) { const v = await ask('Remove route', [{ type: 'info', label: 'Withdraw ' + r.cidr + ' through this gateway? Members move to another gateway of the same network, if there is one.' }], 'Remove'); if (v) act(() => api('DELETE', `/c/${encodeURIComponent(comm)}/routes/${encodeURIComponent(r.cidr.replace('/', '_'))}?via=${r.via}`), 'Route removed'); }
async function editCommunity(c) { const v = await ask('Edit ' + c.name, [{ name: 'mtu', label: 'MTU', value: c.mtu }, { name: 'max_nodes', label: 'Maximum nodes', value: c.max_nodes }], 'Save'); if (v) act(() => api('PUT', '/c/' + encodeURIComponent(c.name), { mtu: +v.mtu, max_nodes: +v.max_nodes }), 'Saved'); }
async function delCommunity(c) {
  const v = await ask('Delete community', [{ type: 'info', label: 'This removes ' + c.users.length + ' user(s) and ' + c.nodes.length + ' node(s) on every relay of the federation. Type the community name to confirm.' }, { name: 'confirm', label: 'Name' }], 'Delete');
  if (v) { if (await act(() => api('DELETE', '/c/' + encodeURIComponent(c.name) + '?confirm=' + encodeURIComponent(v.confirm)), 'Community deleted') !== undefined) view = { page: 'communities' }; await refresh(); }
}
async function addUser(comm) {
  const v = await ask('Add user to ' + comm, [{ name: 'user', label: 'User name' }, { name: 'password', label: 'Password (min 8 characters)', type: 'password' },
    { name: 'role', label: 'Role', type: 'select', options: ['user', 'admin'], value: 'user' }, { name: 'max_nodes', label: 'Node quota', value: '5' }], 'Add');
  if (v) act(() => api('POST', `/c/${encodeURIComponent(comm)}/users`, { user: v.user.trim(), password: v.password, role: v.role, max_nodes: +v.max_nodes }), 'User added');
}
async function editUser(comm, u) {
  const v = await ask('Edit ' + u.user, [{ name: 'role', label: 'Role', type: 'select', options: ['user', 'admin'], value: u.role }, { name: 'max_nodes', label: 'Node quota', value: u.max_nodes }], 'Save');
  if (v) act(() => api('PUT', `/c/${encodeURIComponent(comm)}/users/${encodeURIComponent(u.user)}`, { role: v.role, max_nodes: +v.max_nodes }), 'Saved');
}
async function passwd(comm, user) {
  const v = await ask('New password for ' + user, [{ type: 'info', label: 'All sessions of this user are revoked.' }, { name: 'password', label: 'Password (min 8 characters)', type: 'password' }], 'Change');
  if (v) act(() => api('PUT', `/c/${encodeURIComponent(comm)}/users/${encodeURIComponent(user)}`, { password: v.password }), 'Password changed');
}
async function delUser(comm, user) { const v = await ask('Delete user', [{ type: 'info', label: 'Delete ' + user + '? Their nodes stay registered until removed.' }], 'Delete'); if (v) act(() => api('DELETE', `/c/${encodeURIComponent(comm)}/users/${encodeURIComponent(user)}`), 'User deleted'); }
async function grantRelay(comm, n) {
  const v = await ask('Delegate ' + (n.name || n.id.slice(0, 8)) + ' as a relay node', [{ type: 'info', label: 'The members will send datagrams that cannot go directly through this node (over UDP). The datagrams stay end-to-end encrypted; the node sees who talks to whom and how much. It must be reachable from outside (open or cone NAT).' },
    { name: 'mbit', label: 'Bandwidth limit (Mbit/s)', value: '20' }, { name: 'days', label: 'Valid for (days, 0 = until withdrawn)', value: '0' }, { name: 'force', label: 'Even if not known to be reachable', type: 'select', options: ['no', 'yes'], value: 'no' }], 'Delegate');
  if (v) act(() => api('PUT', `/c/${encodeURIComponent(comm)}/nodes/${n.id}/relay-role`, { max_kbps: Math.round(+v.mbit * 1000), days: +v.days, force: v.force === 'yes' }), 'Relay role granted');
}
async function revokeRelay(comm, n) { const v = await ask('Withdraw relay role', [{ type: 'info', label: (n.name || n.id.slice(0, 8)) + ' stops forwarding for the others; sessions switch to another path within seconds.' }], 'Withdraw'); if (v) act(() => api('DELETE', `/c/${encodeURIComponent(comm)}/nodes/${n.id}/relay-role`), 'Relay role withdrawn'); }
async function delNode(comm, n) { const v = await ask('Remove node', [{ type: 'info', label: 'Remove ' + (n.name || n.id.slice(0, 8)) + ' (' + n.ip + ')? It can register again and will get an address again.' }], 'Remove'); if (v) act(() => api('DELETE', `/c/${encodeURIComponent(comm)}/nodes/${n.id}`), 'Node removed'); }

// ---- shell
function render() {
  const app = $('#app'); app.replaceChildren();
  if (!token) {
    const pw = el('input', { type: 'password', id: 'pw', autocomplete: 'current-password', placeholder: 'Operator password' });
    const code = el('input', { type: 'text', id: 'code', inputmode: 'numeric', autocomplete: 'one-time-code', maxlength: '24', hidden: true,
                               placeholder: 'Authenticator code (or a recovery code)', style: 'margin-top:10px' });
    api('GET', '/info').then(i => { if (i.two_factor) code.hidden = false; }).catch(() => {});
    const go = async () => {
      try {
        const r = await api('POST', '/login', { password: pw.value, code: code.value.trim() });
        token = r.token; sessionStorage.setItem('oneq-admin-token', token); view = { page: 'overview' }; await refresh();
      } catch (e) { toast(e.message, true); code.value = ''; }
    };
    for (const i of [pw, code]) i.addEventListener('keydown', e => { if (e.key === 'Enter') go(); });
    app.append(el('div', { class: 'login' }, el('section', {}, el('h2', {}, 'oneq Relay admin'),
      el('p', { class: 'muted' }, 'Sign in with the operator password of this relay and, when asked, the 6-digit code of your authenticator app.'),
      pw, code, el('div', { class: 'row' }, el('button', { class: 'primary', onclick: go }, 'Sign in')))));
    pw.focus(); return;
  }
  const nav = [['overview', 'Relay'], ['federation', 'Federation'], ['communities', 'Communities']];
  const cur = view.page === 'community' ? 'communities' : view.page;
  app.append(el('header', {}, el('h1', {}, 'oneq Relay admin' + (data.overview ? ' · ' + data.overview.relay.id : '')),
    el('nav', {}, nav.map(([k, l]) => el('button', { class: cur === k ? 'on' : '', onclick: () => { view = { page: k }; refresh(); } }, l))),
    el('button', { onclick: logout }, 'Sign out')));
  const main = el('main', {});
  if (!data.overview) main.append(el('p', { class: 'muted' }, 'Loading…'));
  else if (view.page === 'overview') main.append(...viewOverview());
  else if (view.page === 'federation') main.append(...viewFederation());
  else if (view.page === 'communities') main.append(...viewCommunities());
  else if (view.page === 'community' && data.comm) main.append(...viewCommunity());
  app.append(main);
}
async function refresh() {
  if (!token) return render();
  try {
    data.overview = await api('GET', '/overview');
    if (view.page === 'community') { try { data.comm = await api('GET', '/c/' + encodeURIComponent(view.name)); } catch (e) { data.comm = null; view = { page: 'communities' }; } }
    render();
  } catch (e) { if (token) toast(e.message, true); }
}
render(); if (token) refresh();
setInterval(() => { if (token && !$('#dlg').open) refresh(); }, 5000);
</script>
