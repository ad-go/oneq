# /etc/oneq/node.conf: configuration of oneqnode. One section per node, [NAME]; `[defaults]` applies to all of them.
# `oneqnode-init NAME ...` writes the sections for you. The service is oneqnode@NAME (systemd) or oneqnode-NAME
# (supervisord), the network interface is oneq-NAME. After editing, restart the node:
#   systemctl restart oneqnode@NAME        or        supervisorctl restart oneqnode-NAME
# INI format. Lines starting with # or ; are comments (no comments after a value). Options given on the command
# line override this file; a typo in an option name stops the node with a clear message.
# Keys and passwords are NEVER stored here: only the paths of their files (owned by the oneqnode user, mode 0600).

[defaults]
# CA that signed the oneqrelay certificates, if they are not signed by a CA in the system store.
#cafile = /etc/ssl/certs/ca-certificates.crt
# Service manager used by oneqnode-init: systemd, supervisor or none. Default: detected.
#init = systemd

# Example of a node (create the real one with:
#   sudo oneqnode-init lan --relay https://r1.example.org --relay https://r2.example.org --community lan --user alice)
#
#[lan]
# several relays = failover; separated by commas or spaces
#relays = https://r1.example.org, https://r2.example.org
#community = lan
#user = alice
# name shown in the member list
#label = laptop
#key_file = /etc/oneq/node-lan.key
#password_file = /etc/oneq/node-lan.password
# UDP address
#listen = 0.0.0.0:51820
# reachable address(es), needed behind NAT or a firewall; several separated by commas
#advertise = 203.0.113.5:51820
#stun = stun.example.org:3478
# bind to the address of an existing interface (it stays owned by the process that created it)
#via = IFACE
#force_relay = no
#no_relay = no
# seconds without a direct session before the relay is used
#relay_after = 10

# NAT discovery with the STUN service of the relay: the node measures its NAT (open, cone, port-restricted, symmetric), publishes
# its public UDP address when other nodes can use it, and skips the wait for a direct path when it cannot work (for example
# symmetric against port-restricted). Set to no to disable. `oneqnode nat-check RELAY_HOST:PORT` shows the result without joining.
#nat_discovery = yes

# Ask the home router (PCP, NAT-PMP, UPnP) to forward this node's UDP port. The mapping is published as an open address only after the
# relay has reached it from outside; it is removed when the node stops. Set to no to leave the router alone.
#port_mapping = yes
# Dual-stack UDP socket: publish this host's global IPv6 address and try the IPv6 addresses of the other members. no: IPv4 only.
#ipv6 = yes
# no: use an already configured persistent TAP interface
#configure_interface = yes

# Offer to forward datagrams (end-to-end encrypted, never decrypted) for the other members of the community when they cannot reach each other
# directly. Takes effect only after an administrator delegates this node (admin page of a oneqrelay, or `oneqrelay admin relay-grant`);
# the node must be reachable from outside (public address or forwarded UDP port; its NAT is measured as open or cone).
#relay_offer = no
# Do not use the delegated relay nodes of the community:
#use_delegates = yes

# Update check: once a day (first time shortly after start) the node looks whether a newer release exists on GitHub
# (https://github.com/ad-go/oneq/releases) and logs one line when it does. Nothing is downloaded or installed automatically;
# `oneqnode update-check` shows the result and `oneqnode update-download` fetches the package and verifies its SHA-256.
# Set to no to stop the daily check (the two commands keep working). update_url overrides the release API URL (https only).
#update_check = yes
#update_url = https://api.github.com/repos/ad-go/oneq/releases/latest
