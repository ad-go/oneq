; supervisord program for oneqrelay. The postinst copies this file to /etc/supervisor/conf.d/oneqrelay.conf when
; supervisord is the service manager in use (see README.Debian). `run` drops privileges to the oneqrelay user.
[program:oneqrelay]
command=/opt/oneq/relay/bin/run
autostart=true
autorestart=true
startsecs=3
startretries=10
stopsignal=TERM
stopwaitsecs=15
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/var/log/oneq/relay.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
