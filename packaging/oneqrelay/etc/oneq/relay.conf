# /etc/oneq/relay.conf: configuration of oneqrelay (the federated registry and relay).
# Read by `oneqrelay run --config /etc/oneq/relay.conf`, which the packaged service starts.
# INI format. Lines starting with # or ; are comments (no comments after a value). After editing:
#   systemctl restart oneqrelay      or      supervisorctl restart oneqrelay
# Options given on the command line override this file. A typo in an option name stops the service with a clear message.

[relay]
# Name of this relay inside the federation. Must be unique. Default: the short host name.
#id = relay1

# Where to listen. Default: plain HTTP on the loopback interface, meant to sit behind a reverse proxy that terminates
# TLS 1.3 with X25519MLKEM768 only (example: /usr/share/doc/oneqrelay/examples/nginx-oneqrelay.conf).
listen = 127.0.0.1:8080
insecure_http = yes
trust_proxy = yes

# Direct TLS without a proxy: set insecure_http = no and trust_proxy = no, and give a certificate and key that the
# oneqrelay user can read.
#cert = /etc/oneq/relay.crt
#key = /etc/oneq/relay.key

# Registry database (accounts, nodes, addresses) and federation secret. The secret is generated at install time;
# every relay of one federation must use the SAME secret (copy the file, owner oneqrelay, mode 0600).
db = /var/lib/oneq/relay/registry.db
secret_file = /etc/oneq/relay.secret

# The other relays of the federation: their public https URLs, separated by commas or spaces. `cafile` is only needed
# when their certificates are not signed by a CA in the system store.
#federation_peers = https://r2.example.org, https://r3.example.org
#cafile = /etc/ssl/certs/ca-certificates.crt

# NAT discovery: a STUN service on UDP, three ports on the listen address (default: the listen port, +1 and +2). Nodes behind
# a NAT use it to learn their public address and NAT type, and the relay can test whether a node accepts unsolicited
# packets. Open these three UDP ports in the firewall (the same number as the TCP port plus the two next ones). Turn it off
# with `stun = no`; nodes then only know the addresses given with `advertise` and rely on the relay behind NATs.
#stun = yes
#stun_port = 8443
#stun_alt_port = 8444
#stun_change_port = 8445

# Proof of possession of the node key. A node id is the hash of a public key, and public keys are public: without a proof anybody with an account
# could register somebody else's key with endpoints of its own. Nodes of this version prove possession of their key at every registration (the
# relay sends a challenge only the key holder can open) and a node id registered with a proof can no longer be updated without one. `yes` also
# refuses registrations without a proof (older nodes cannot give one: turn it on once all nodes are updated).
#require_pop = no

# Admin page at https://<this relay>/admin/ (relay settings, federation peers, communities, users, nodes). Off unless this
# is set. Create the password file once, readable only by the service user:
#   sudo install -m 0600 -o oneqrelay -g oneqrelay /dev/null /etc/oneq/admin.pw
#   sudo -u oneqrelay oneqrelay gen-admin-password --out /etc/oneq/admin.pw.new && sudo mv /etc/oneq/admin.pw.new /etc/oneq/admin.pw
# (the password is printed once). A SECOND FACTOR is mandatory (codes of any authenticator app, RFC 6238): create it once,
#   sudo -u oneqrelay oneqrelay admin-totp --out /var/lib/oneq/relay/admin.totp --issuer "oneqrelay $(hostname -s)"
# (in /var/lib/oneq/relay, not /etc: the service keeps the last used code and the spent recovery codes in that file and
# systemd mounts /etc read-only for it) scan the QR code it prints (or type the secret) and keep the ten recovery codes offline. Without admin_totp_file the relay
# refuses to start the page: the second factor cannot be switched off.
# admin_allow limits the page to some networks (everybody else gets a plain 404), e.g. your office and your private network.
# Restart the service after changing these settings.
#admin_password_file = /etc/oneq/admin.pw
#admin_totp_file = /var/lib/oneq/relay/admin.totp
#admin_allow = 203.0.113.0/24, 10.0.0.0/8

# Service manager used by the package scripts: systemd, supervisor or none. Default: detected (systemd if it is PID 1,
# else supervisord if installed).
#init = systemd

# Update check: the relay looks once a day (first time shortly after start) whether a newer release exists on GitHub
# (https://github.com/ad-go/oneq/releases) and logs one line when it does. The admin page shows it and can download the .deb into
# update_dir with SHA-256 verification; nothing is ever installed automatically. The "Check for updates" button on the admin page
# works even when this is off. update_url overrides the release API URL (https only).
#update_check = yes
#update_url = https://api.github.com/repos/ad-go/oneq/releases/latest
#update_dir = /var/lib/oneq/relay/updates
