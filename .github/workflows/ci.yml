# Not yet run on GitHub: written from the commands that work locally (see the notes at the end of the file).
name: ci
on:
  push:
  pull_request:

jobs:
  python:
    name: Python tests (no root)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      # python-build-standalone: its OpenSSL must be >= 3.5 for the post-quantum TLS group that pqtls.py requires (checked below)
      - run: uv python install 3.13
      - run: uv venv --python 3.13 .venv && uv pip install --python .venv/bin/python -r requirements.txt segno
      - name: OpenSSL of the interpreter
        run: .venv/bin/python -c "import ssl; print(ssl.OPENSSL_VERSION); assert ssl.OPENSSL_VERSION_INFO >= (3, 5)"
      - name: tests
        run: |
          set -e
          for t in test_mesh_core test_oneqtunel test_oneqconf test_oneqtotp test_oneqnat test_oneqportmap test_oneqpop test_oneqinit test_oneqadmin test_oneqrelay test_oneqnode test_relay_delegation test_relay_delegation_node test_routes; do
            echo "== $t"; .venv/bin/python $t.py
          done
      - name: specification matches the code
        run: .venv/bin/python spec_check.py

  python-root:
    name: Python tests with root and network namespaces
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv python install 3.13
      - run: uv venv --python 3.13 .venv && uv pip install --python .venv/bin/python -r requirements.txt segno
      - run: sudo apt-get update && sudo apt-get install -y nftables iproute2
      - run: sudo .venv/bin/python test_e2e_mesh.py
      - run: sudo .venv/bin/python test_nat_sim.py

  rust:
    name: Rust core (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: client
      - run: cargo test -p oneq-core --lib

  rust-audit:
    name: Rust dependencies (cargo audit, cargo deny)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit,cargo-deny
      - run: cargo audit
      - run: cargo deny check advisories licenses sources

  fuzz:
    name: Fuzzing (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [handshake, transport, fragments, frames, registry_json]
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: client/fuzz
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      - uses: actions/cache@v4
        with:
          path: client/fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: fuzz-corpus-${{ matrix.target }}-
      # 3 minutes per target on every push; the corpus is kept between runs. A crash uploads the input that caused it.
      - run: cargo fuzz run ${{ matrix.target }} -- -max_total_time=180 -rss_limit_mb=2048
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: fuzz-crash-${{ matrix.target }}
          path: client/fuzz/artifacts/${{ matrix.target }}

  extension:
    name: Browser extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node client/browser/test/pac.test.js

# Notes
# * rust-audit and fuzz: not run yet (cargo-audit ran locally; cargo-fuzz needs nightly and a Linux runner). The same code is exercised on every platform by
#   `cargo test -p oneq-core --lib fuzzing` (deterministic random and mutated input).
# * The Python scripts are plain unittest modules (`python test_x.py`). test_e2e_mesh.py and test_nat_sim.py skip themselves without root.
# * Left out on purpose: test_nginx_proxy.py (needs nginx and certificates), client/browser/test/chrome_e2e.py (needs a browser),
#   the Flutter app and the Android build, and every release/signing step. Release builds and signing keys belong in a separate
#   workflow on `v*` tags that reads the signing key from GitHub Secrets; it is not written yet.
