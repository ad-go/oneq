[workspace]
members = ["core"]
resolver = "2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

# tun-rs and route_manager also build cdylib/staticlib outputs we never use; cross-linking those fails with zig on Windows
[patch.crates-io]
tun-rs = { path = "third_party/tun-rs" }
route_manager = { path = "third_party/route_manager" }
