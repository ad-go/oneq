# nginx configuration when oneqrelay shares a container with another application.
#
# Run oneqrelay with:
#   --listen 127.0.0.1:8081 --insecure-http --trust-proxy
# Run your application on 127.0.0.1:8080.
# Place this file in /etc/nginx/sites-enabled/oneq (remove the default site).
#
# Paths:
#   /admin/  /admin/api/    relay admin UI + REST API
#   /v1/                    relay node API (WebSocket for node connections)
#   /fed/                   relay federation (WebSocket)
#   /                       main application on port 8080
#
# Two variants below — uncomment one:
#
#   A. STANDALONE (direct HTTPS, TLS 1.3 + X25519MLKEM768 + Let's Encrypt).
#      Requires certs; see deploy/tls/oneq-cert.sh.
#      Replaces r1.example.org with the relay's public hostname.
#
#   B. BEHIND PROXY (HTTP only, for use behind nginx-proxy-acme, Caddy, etc.).
#      The outer proxy terminates TLS and adds X-Forwarded-Proto: https.
#      Use this inside a Docker container together with nginx-proxy-acme.
#
# The existing deploy/nginx-oneqrelay.conf routes everything to the relay; this
# file adds a separate upstream for the main application at /.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ─── A. STANDALONE (direct HTTPS) ────────────────────────────────────────────
# Comment out this block when using variant B.

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name r1.example.org;

    ssl_certificate     /etc/letsencrypt/live/r1.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/r1.example.org/privkey.pem;

    ssl_protocols             TLSv1.3;
    ssl_ecdh_curve            X25519MLKEM768;
    ssl_prefer_server_ciphers off;
    ssl_session_tickets       off;

    client_max_body_size 16k;

    location /admin/ {
        proxy_pass         http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-For   $remote_addr;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_buffering    off;
    }

    location /v1/ {
        proxy_pass         http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        $connection_upgrade;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-For   $remote_addr;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_read_timeout 300s;
        proxy_buffering    off;
    }

    location /fed/ {
        proxy_pass         http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        $connection_upgrade;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-For   $remote_addr;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_read_timeout 300s;
        proxy_buffering    off;
    }

    location / {
        proxy_pass         http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        $connection_upgrade;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-For   $remote_addr;
        proxy_set_header   X-Forwarded-Proto https;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name r1.example.org;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

# ─── B. BEHIND PROXY (HTTP, no TLS inside container) ─────────────────────────
# Uncomment this block and comment out variant A when using nginx-proxy-acme.
# The outer proxy sets X-Forwarded-Proto: https, which relay reads via trust_proxy.

