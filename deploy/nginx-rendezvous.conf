# nginx in front of rendezvous_server.py (run with --insecure-http --trust-proxy on 127.0.0.1:8080).
# Put this file in /etc/nginx/conf.d/ (http context). Requires nginx built against OpenSSL >= 3.5.
#
# TLS policy: TLS 1.3 only, key exchange ONLY X25519MLKEM768. A client that does not offer this
# group gets handshake_failure; there is no classical fallback. (test_nginx_proxy.py checks this.)
#
# Certificate: Let's Encrypt, e.g.  certbot certonly --webroot -w /var/www/acme -d rv.example.org
# Let's Encrypt certificates are classical (ECDSA/RSA) signatures; only the key exchange is post-quantum.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 443 ssl;
    server_name rv.example.org;

    ssl_certificate     /etc/letsencrypt/live/rv.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rv.example.org/privkey.pem;

    ssl_protocols TLSv1.3;
    ssl_ecdh_curve X25519MLKEM768;
    ssl_prefer_server_ciphers off;

    client_max_body_size 16k;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;       # wss://.../v1/relay
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;  # overwrite, never append (rendezvous_server --trust-proxy)
        proxy_read_timeout 120s;
    }
}
