# nginx in front of oneqrelay (run it with --insecure-http --trust-proxy on 127.0.0.1:8080).
# Put this file in /etc/nginx/conf.d/. Needs nginx built against OpenSSL >= 3.5.
#
# TLS policy: TLS 1.3 only, key exchange ONLY X25519MLKEM768 (no classical fallback), for the client API,
# the relay WebSocket (/v1/relay) and the federation endpoints (/fed/...) alike.
# Federation peers reach each other through this same https endpoint, so give each oneqrelay a public name:
#   --fed-peer https://r2.example.org   (and --cafile with the CA that signed the certificates)
# Certificates: Let's Encrypt (classical signatures; only the key exchange is post-quantum).

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 443 ssl;
    server_name r1.example.org;

    ssl_certificate     /etc/letsencrypt/live/r1.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/r1.example.org/privkey.pem;

    ssl_protocols TLSv1.3;
    ssl_ecdh_curve X25519MLKEM768;
    ssl_prefer_server_ciphers off;

    client_max_body_size 16k;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;   # overwrite, never append (oneqrelay --trust-proxy)
        proxy_read_timeout 120s;
        proxy_buffering off;
    }
}
